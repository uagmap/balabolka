services:
  xray:
    # Keep a pinned version. `latest` can introduce TLS/runtime regressions.
    image: ghcr.io/xtls/xray-core:26.7.11
    container_name: balabolka-xray
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: balabolka-bot:latest
    container_name: balabolka-bot
    env_file:
      - ./config/.env
    restart: unless-stopped

  watchdog:
    image: curlimages/curl:8.19.0
    container_name: balabolka-watchdog
    user: "0:0"
    depends_on:
      - xray
      - bot
    command: ["sh", "/recover.sh"]
    env_file:
      - ./config/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchdog/recover.sh:/recover.sh:ro
    restart: unless-stopped
